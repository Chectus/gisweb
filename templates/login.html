<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | ГИС Забайкалья</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- ПОДКЛЮЧАЕМ ЕДИНЫЙ CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card mt-5">
                    <div class="login-icon-wrapper">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    
                    <div class="card-body p-4 pt-2">
                        <h4 class="card-title text-center mb-1 fw-bold" style="color: var(--geo-dark);">Web GIS</h4>
                        <p class="text-center text-muted small mb-4">Авторизация сотрудника</p>
                        
                        {% if error %}
                            <div class="alert alert-danger text-center small py-2 fw-medium" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                            </div>
                        {% endif %}
                        
                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold" style="color: var(--geo-main);">Логин</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="ivanov_geo" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold" style="color: var(--geo-main);">Пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                                    <button class="btn btn-eye border-start-0" type="button" id="togglePassword">
                                        <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-geo w-100 fw-bold py-2 mb-2">
                                Войти в систему <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4 small" style="color: rgba(255,255,255,0.5);">
                    &copy; 2026 Лаборатория ГИС
                </div>
                
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
