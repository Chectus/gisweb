<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | ГИС Забайкалья</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- ПОДКЛЮЧАЕМ НАШ ВЫНЕСЕННЫЙ CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        /* Специфичные стили только для страницы входа */
        body.login-page {
            /* Темный топографический фон из нашей палитры */
            background-color: var(--geo-dark);
            background-image: 
                linear-gradient(135deg, rgba(17, 38, 56, 0.95) 0%, rgba(27, 87, 140, 0.85) 100%),
                url("https://www.transparenttextures.com/patterns/topography.png");
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-bottom: 4px solid var(--geo-accent); /* Медный акцент снизу */
            position: relative;
        }

        .login-icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: var(--geo-dark);
            color: var(--geo-accent);
            border: 3px solid var(--geo-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: -40px auto 20px auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .input-group-text {
            background-color: var(--geo-light);
            border-color: rgba(27, 87, 140, 0.2);
            color: var(--geo-main);
        }

        .form-control { border-color: rgba(27, 87, 140, 0.2); }
        .form-control:focus { 
            border-color: var(--geo-main); 
            box-shadow: 0 0 0 0.25rem rgba(27, 87, 140, 0.25); 
        }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card mt-5">
                    <!-- Парящая медная иконка -->
                    <div class="login-icon-wrapper">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    
                    <div class="card-body p-4 pt-2">
                        <h4 class="card-title text-center mb-1 fw-bold" style="color: var(--geo-dark);">Web GIS</h4>
                        <p class="text-center text-muted small mb-4">Авторизация сотрудника</p>
                        
                        {% if error %}
                            <div class="alert alert-danger text-center small py-2 fw-medium" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                            </div>
                        {% endif %}
                        
                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold" style="color: var(--geo-main);">Логин</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="ivanov_geo" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold" style="color: var(--geo-main);">Пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-geo w-100 fw-bold py-2 mb-2">
                                Войти в систему <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4 small" style="color: rgba(255,255,255,0.5);">
                    &copy; 2026 Лаборатория ГИС
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
