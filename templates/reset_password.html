<!-- 
  Файл: reset_password.html
  Описание: Страница установки нового пароля. 
  Открывается при переходе по ссылке из письма восстановления доступа. 
  Обеспечивает ввод и валидацию нового пароля пользователя.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | Недра Забайкальского края</title>
    
    <!-- Подключение внешних библиотек и локальных стилей -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <!-- Основной контейнер с центрированием формы -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Карточка формы с вынесенным за верхнюю границу логотипом -->
                <div class="card login-card mt-5 shadow-sm border-0">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Лого" 
                         style="height: 120px; width: 120px; margin-top: -60px; position: relative; z-index: 1;" 
                         class="d-block mx-auto mb-3">

                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Заголовок и описание страницы -->
                        <div class="text-center mb-4">
                            <h4 class="card-title fw-bold mt-2" style="color: var(--geo-dark);">Новый пароль</h4>
                            <p class="text-muted small">Придумайте надежный пароль для вашей учетной записи.</p>
                        </div>

                        <!-- Блок вывода ошибок валидации от сервера -->
                        {% if error %}
                            <div class="alert alert-danger text-center small py-2 fw-medium mb-3" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                            </div>
                        {% endif %}

                        <!-- Форма сохранения нового пароля -->
                        <form method="POST" id="resetPwdForm">
                            
                            <!-- Поле ввода пароля с переключателем видимости -->
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-secondary">Новый пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" name="password" id="newPasswordField" class="form-control border-start-0 border-end-0 ps-0" placeholder="Минимум 8 символов" required>
                                    <button class="btn btn-eye border-start-0 toggle-pwd-btn" type="button">
                                        <i class="bi bi-eye text-muted"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Поле подтверждения пароля -->
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary">Повторите пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                                    <input type="password" id="repeatPasswordField" class="form-control border-start-0 border-end-0 ps-0" placeholder="Пароли должны совпадать" required>
                                    <button class="btn btn-eye border-start-0 toggle-pwd-btn" type="button">
                                        <i class="bi bi-eye text-muted"></i>
                                    </button>
                                </div>
                                <div id="resetPwdError" class="text-danger small mt-2 d-none">
                                    <i class="bi bi-x-circle me-1"></i> Пароли не совпадают!
                                </div>
                            </div>
                            
                            <!-- Кнопка подтверждения и отправки формы -->
                            <button type="submit" class="btn btn-geo w-100 fw-medium py-2 mb-3">
                                Сохранить пароль
                            </button>

                            <div class="text-center">
                                <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
                                    <i class="bi bi-arrow-left me-1"></i> Вернуться ко входу
                                </a>
                            </div>
                            
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Скрипт переключения видимости символов и проверки совпадения паролей -->
    <script>
        document.querySelectorAll('.toggle-pwd-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            });
        });

        document.getElementById('resetPwdForm').addEventListener('submit', function (e) {
            const pwd = document.getElementById('newPasswordField').value;
            const repeatPwd = document.getElementById('repeatPasswordField').value;
            const errorDiv = document.getElementById('resetPwdError');

            if (pwd !== repeatPwd) {
                e.preventDefault();
                errorDiv.classList.remove('d-none');
            } else {
                errorDiv.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
