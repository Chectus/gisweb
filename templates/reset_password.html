<!-- 
  Файл: reset_password.html
  Описание: Страница установки нового пароля. 
  Открывается при переходе по ссылке из письма восстановления доступа. 
  Обеспечивает ввод и валидацию нового пароля пользователя.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | Недра Забайкальского края</title>
    
    <!-- Подключение внешних библиотек и локальных стилей -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <!-- Основной контейнер с центрированием формы -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Карточка формы с вынесенным за верхнюю границу логотипом -->
                <div class="card login-card mt-5 shadow-sm border-0">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Лого" 
                         style="height: 120px; width: 120px; margin-top: -60px; position: relative; z-index: 1;" 
                         class="d-block mx-auto mb-3">

                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Заголовок и описание страницы -->
                        <div class="text-center mb-4">
                            <h4 class="card-title fw-bold mt-2" style="color: var(--geo-dark);">Новый пароль</h4>
                            <p class="text-muted small">Придумайте надежный пароль для вашей учетной записи.</p>
                        </div>

                        <!-- Блок вывода ошибок валидации от сервера -->
                        {% if error %}
                            <div class="alert alert-danger text-center small py-2 fw-medium mb-3" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                            </div>
                        {% endif %}

                        <!-- Форма сохранения нового пароля -->
                        <form method="POST">
                            
                            <!-- Поле ввода пароля с переключателем видимости -->
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary">Новый пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" name="password" id="newPasswordField" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required>
                                    <button class="btn border border-start-0 bg-white" type="button" id="toggleNewPassword">
                                        <i class="bi bi-eye text-muted" id="toggleNewIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Кнопка подтверждения и отправки формы -->
                            <button type="submit" class="btn w-100 fw-medium text-white" style="background-color: var(--geo-main);">
                                Сохранить пароль
                            </button>
                            
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Скрипт переключения видимости символов в поле пароля -->
    <script>
        const togglePassword = document.getElementById('toggleNewPassword');
        const passwordInput = document.getElementById('newPasswordField');
        const toggleIcon = document.getElementById('toggleNewIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
