<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забыли пароль | Недра Забайкальского края</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    
    <!-- ПОДКЛЮЧАЕМ ЕДИНЫЙ CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card mt-5 shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <i class="bi bi-envelope-at-fill" style="font-size: 2.5rem; color: var(--geo-main);"></i>
                            <h4 class="card-title fw-bold mt-2" style="color: var(--geo-dark);">Восстановление доступа</h4>
                            <p class="text-muted small">Введите email, привязанный к аккаунту, и мы отправим ссылку для сброса пароля.</p>
                        </div>

                        {% if message %}
                            <div class="alert alert-info text-center small py-2 fw-medium mb-3" role="alert">
                                <i class="bi bi-info-circle-fill me-1"></i> {{ message }}
                            </div>
                        {% endif %}

                        <form method="POST">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary">Ваша почта</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <!-- Бэкенд ждет именно name="email" -->
                                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="user@zabgu.ru" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn w-100 fw-medium text-white mb-3" style="background-color: var(--geo-main);">
                                Отправить ссылку
                            </button>
                            
                            <div class="text-center">
                                <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
                                    <i class="bi bi-arrow-left me-1"></i> Вернуться ко входу
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
