<!doctype html>
<html lang="ru" class="map-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карта Забайкалья | Лаборатория ГИС</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <!-- ПОДКЛЮЧАЕМ НАШ ВЫНЕСЕННЫЙ CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
  </head>
  <body class="map-body">
    <script>
        // Срабатывает мгновенно, до отрисовки карточек и текстов
        if (localStorage.getItem('app-theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>
    
    <!-- ОБНОВЛЕННАЯ СИНЯЯ НАВИГАЦИЯ -->
    <nav class="navbar navbar-expand-lg navbar-custom py-2">
      <div class="container-fluid">
          <a class="btn btn-outline-light btn-sm fw-medium me-3 border-opacity-50" href="/hub">
              <i class="bi bi-arrow-left"></i> <span class="d-none d-md-inline">Назад</span>
          </a>
          <span class="navbar-brand mb-0 h5 text-white fw-bold d-flex align-items-center">
              <i class="bi bi-globe-americas me-2" style="color: var(--geo-accent);"></i>
              ГИС Забайкальского края
          </span>
            <button id="theme-toggle" class="btn btn-outline-light border-0 me-2" title="Переключить тему">
                <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
            </button>
          
      </div>
    </nav>

    <div class="map-wrapper">
      <nav id="layersSidebar" class="p-3 bg-white">
        <!-- Шапка бокового меню -->
        <h5 class="fw-bold mb-4 border-bottom pb-2" style="color: var(--geo-dark);">
          <i class="bi bi-layers me-2" style="color: var(--geo-main);"></i>Слои карты
        </h5>

        <div class="sidebar-content overflow-auto">
          <div class="mb-4">
            <label class="form-label text-muted small text-uppercase fw-bold mb-2">Подложка</label>
            <div class="d-flex flex-column gap-2">
              <div class="form-check layer-item">
                <input class="form-check-input" type="radio" name="basemap" id="bm2Gis" value="gis2" checked />
                <label class="form-check-label w-100" for="bm2Gis"><strong>Схема 2GIS</strong></label>
              </div>
              <div class="form-check layer-item">
                <input class="form-check-input" type="radio" name="basemap" id="bmEsri" value="esri" />
                <label class="form-check-label w-100" for="bmEsri"><strong>Спутник Esri</strong></label>
              </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small text-uppercase fw-bold mb-2">Данные</label>
            <!-- Это пустой контейнер. Вся магия теперь происходит внутри него -->
            <div class="d-flex flex-column gap-2" id="layersAccordion">
                
                <!-- ПУСТОТА. ВЕСЬ ХАРДКОД УДАЛЁН -->
                <!-- Сюда наш новый скрипт initDynamicLayers() сам нарисует все папки и чекбоксы, скачав их из JSON -->
                
            </div>
          </div>
        </div>
      </nav>

      <button type="button" id="layersSidebarCollapse" class="btn border text-center">
        <i class="bi bi-chevron-left" id="layerToggleIcon"></i>
      </button>

      <nav id="attributeSidebar" class="p-3 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
          <!-- Шапка таблицы атрибутов -->
          <h5 class="fw-bold mb-0" style="color: var(--geo-dark);"><i class="bi bi-table me-2" style="color: var(--geo-main);"></i>Таблица слоя</h5>
          <button type="button" class="btn-close" id="closeAttributeSidebar" aria-label="Close"></button>
        </div>
        <div id="attributeTableContainer" class="overflow-auto flex-grow-1" style="height: 100%;">
          <div class="text-center text-muted mt-5">Кликните по иконке таблицы у любого слоя</div>
        </div>
      </nav>

      <div id="map"></div>
      <!-- QGIS-подобный переключатель масштаба -->
      <div class="qgis-scale-control shadow-sm border rounded bg-white px-2 py-1 d-flex align-items-center" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;">
          <i class="bi bi-search text-muted me-2 small"></i>
          <span class="text-muted small fw-bold me-2">Масштаб</span>
          <select id="scaleSelect" class="form-select form-select-sm border-0 fw-bold" style="cursor: pointer; box-shadow: none; width: 140px;">
              <option value="5">1:10 000 000</option>
              <option value="6">1:5 000 000</option>
              <option value="8">1:1 000 000</option>
              <option value="9">1:500 000</option>
              <option value="10">1:200 000</option>
              <option value="12">1:100 000</option>
              <option value="13">1:50 000</option>
              <option value="14">1:25 000</option>
              <option value="15">1:10 000</option>
          </select>
      </div>
    </div>

    <!-- БАЗОВЫЕ СКРИПТЫ (Теперь строго в одном экземпляре!) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Бэкенд подставит сюда массив [324, 325, 380, 381] или строку "*" для админов -->
    <script>  const userAllowedLayers = {{ allowed_layers | safe }}; </script>


    <!-- ПОДКЛЮЧАЕМ НАШ ВЫНЕСЕННЫЙ JS -->
    <script src="../static/js/map_logic.js"></script>
    <!-- ПОДКЛЮЧАЕМ НАШ СКРИПТ ТЕМЫ -->
    <script src="../static/js/theme.js"></script>

  </body>
</html>
